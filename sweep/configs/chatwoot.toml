# The sweep's Chatwoot config: the target and readback every tool in
# sweep/run.sh uses against the stack in sweep/compose/chatwoot.yml.
#
# Both secrets come from sweep/.env.chatwoot, which sweep/setup/chatwoot.sh
# writes:
#
#   CHATWOOT_INGRESS_AUTH  "Basic <base64 of actionmailbox:password>", the
#                          same value `testinghq config basic-auth
#                          actionmailbox` prints for the ingress password
#   CHATWOOT_API_TOKEN     the access token of the admin the setup creates
#
#   set -a; . sweep/.env.chatwoot; set +a
#   testinghq verify fire --send --target chatwoot --config sweep/configs/chatwoot.toml

# ---------------------------------------------------------------------------
# Target: Action Mailbox's SendGrid ingress
# ---------------------------------------------------------------------------
#
# Chatwoot runs with RAILS_INBOUND_EMAIL_SERVICE=sendgrid, so its Action
# Mailbox takes SendGrid's raw mode (the whole message in the `email` field)
# behind HTTP Basic auth, user `actionmailbox`.
#
# The ingress prepends each envelope recipient to the message as an
# X-Original-To header, and Chatwoot files a message under the email inbox
# whose address or forwarding address is in To, Cc or X-Original-To; anything
# else is dropped. envelope_to is the forwarding address the setup gives the
# sweep inbox, so every message reaches it whatever its To header says.

[targets.chatwoot]
url = "http://127.0.0.1:3100/rails/action_mailbox/sendgrid/inbound_emails"
format = "sendgrid-raw"
envelope_to = "desk@inbound.chatwoot.test"

[targets.chatwoot.headers]
Authorization = "env:CHATWOOT_INGRESS_AUTH"

# ---------------------------------------------------------------------------
# Readback: message search, by the tag marker
# ---------------------------------------------------------------------------
#
#   GET /api/v1/accounts/1/search/messages?q=[testinghq:<tag>]
#
# Chatwoot's message search matches a message whose content contains `q`
# (an ILIKE, newest first, messages from the last three months). The content
# of an email message is its text body, so the [testinghq:<tag>] marker every
# TestingHQ message carries is in it, and the closing bracket keeps one tag
# from matching a longer one. The answer is one record per message, so a
# reply Chatwoot threads into an earlier conversation reads back as itself,
# with the conversation it landed on as its ticket. The conversation list
# answers per conversation instead, and every message of a thread read back
# as the thread's first sender and latest message.
#
# The response is {"payload": {"messages": [...]}}, 15 to a page, paged with
# `page`. The listing, for stray records, is a search for `testinghq:`: every
# message any TestingHQ run sent, and not the activity messages Chatwoot adds
# itself. A record the pipeline made with no marker at all is not listed.
#
# Account 1 is the first account on an instance; use yours.

[readback]
kind = "http"
url = "http://127.0.0.1:3100/api/v1/accounts/1/search/messages"
method = "GET"
tag_param = "q"
query = "[testinghq:{tag}]"
items_key = "payload.messages"
page_param = "page"
list_path = "/api/v1/accounts/1/search/messages?q=testinghq:"
enumerate = true
max_pages = 100
timeout = 15.0

[readback.headers]
api_access_token = "env:CHATWOOT_API_TOKEN"

# ---------------------------------------------------------------------------
# Field map
# ---------------------------------------------------------------------------
#
# A message as the search renders it. `sender` is the contact Chatwoot
# recorded the message as coming from, and `content_attributes.email` keeps
# the parsed email: its subject and its threading headers without their angle
# brackets. `conversation_id` is the ticket, and `inbox_id` the route.

[readback.fields]
ticket_id = "conversation_id"
from_addr = "sender.email"
subject = "content_attributes.email.subject"
body = "content"
route = "inbox_id"
message_id = "content_attributes.email.message_id"
in_reply_to = "content_attributes.email.in_reply_to"
references = "content_attributes.email.references"

# NOT MAPPED: attachment_names. An attachment carries a url and a file type,
# not the original file name.

# ---------------------------------------------------------------------------
# loop
# ---------------------------------------------------------------------------
#
# The inbox's own address is where an autoresponder would answer. The stack
# gives Chatwoot no outbound mail server to read back from, so there is no
# [loop.outbound] and the auto-reply check reads NOT CHECKED.

[loop]
reply_address = "desk@inbound.chatwoot.test"
# Chatwoot opens a conversation for every message an email inbox takes, an
# auto-reply or a bounce included, marks one it recognises as automatic
# (additional_attributes.auto_reply, from Auto-Submitted or X-Autoreply) so
# automations skip it, and sends no automatic email of its own. The
# conversation is reported, not a finding.
ticket_policy = "allowed"

# ---------------------------------------------------------------------------
# steady
# ---------------------------------------------------------------------------
#
# Chatwoot does not classify mail. The one decision it makes about a message
# is the inbox it lands in, so steady reads that: every variant should land in
# the sweep inbox, and the report says so when every family reads the same.

[steady]
label_field = "route"
