# Dovecot for the FreeScout stack: one IMAP user, one Maildir, no TLS.
#
# Replaces the image's /etc/dovecot/dovecot.conf. The delivery sidecar
# (maildir_smtp.py) writes mail into /srv/mail/<user>/Maildir/new, owned by
# uid 1000 (the image's vmail user), and FreeScout fetches it from here over
# IMAP on port 143 inside the compose network.
#
# Any user name logs in with the one static password below. It is a fixed
# value for a throwaway test mailbox that holds synthetic mail only, reachable
# from the compose network and from 127.0.0.1, never from anywhere else. The
# setup script gives FreeScout the same value.

protocols = imap
listen = *

mail_home = /srv/mail/%Ln
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

passdb {
  driver = static
  args = password=thq-freescout-imap
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Ln
}

# Plain IMAP inside the compose network: no certificate to manage, and
# FreeScout's mailbox is set to "no encryption" to match.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

namespace inbox {
  inbox = yes
  separator = /
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
