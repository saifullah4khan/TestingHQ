# Dovecot for the Zammad stack: one POP3 user, one Maildir, no TLS.
#
# Replaces the image's /etc/dovecot/dovecot.conf. The delivery sidecar
# (sweep/compose/freescout/maildir_smtp.py, as zammad-deliver) writes mail
# into /srv/mail/zammad/Maildir/new, owned by uid 1000 (the image's vmail
# user), and Zammad's email channel fetches it from here over POP3 on port
# 1110 inside the compose network, then deletes what it fetched.
#
# Dovecot lists a mailbox in the order the mail arrived, which is the order
# Zammad imports a fetch in. Mailpit's POP3 server, which this replaces,
# lists newest first, so every fetch was imported in reverse and a thread
# that arrived together was filed reply before original.
#
# Any user name logs in with the one static password below. It is a fixed
# value for a throwaway test mailbox that holds synthetic mail only, reachable
# from the compose network and from 127.0.0.1, never from anywhere else. The
# setup script gives Zammad's channel the same value.

protocols = pop3
listen = *

mail_home = /srv/mail/%Ln
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

passdb {
  driver = static
  args = password=thq-sweep-pop3
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Ln
}

# Plain POP3 inside the compose network: no certificate to manage, and the
# channel is set to ssl off to match.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

pop3_uidl_format = %08Xu%08Xv

namespace inbox {
  inbox = yes
  separator = /
}

service pop3-login {
  inet_listener pop3 {
    port = 1110
  }
  inet_listener pop3s {
    port = 0
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
