name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  # The interpreter matrix. Named "test-version" so that the gate below can
  # keep the name "tests".
  test-version:
    runs-on: ubuntu-latest
    strategy:
      # Every version pyproject.toml claims, not a sample of them. The claim
      # was once >=3.9 while only 3.11 was ever run, which is a promise nothing
      # was checking, and on 3.9 and 3.10 it was false in a way that mattered:
      # the TOML parser is stdlib only from 3.11, so `tomli` is a declared
      # conditional dependency. The floor is 3.10 because 3.9 reached end of
      # life in October 2025; see docs/decisions/0002-python-floor-3-10.md.
      #
      # fail-fast is off so one broken version does not hide the state of the
      # others. A matrix that cancels itself on the first failure cannot tell
      # you "3.10 is broken and 3.11 is fine", which is the information you need.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        # -m "not allow_network" is what keeps this job hermetic. `testpaths`
        # is "tests", so a bare `pytest -q` collects every test marked
        # allow_network, and those open real sockets. Selecting on the marker
        # rather than ignoring a directory: tests/web/test_server.py is also
        # exempt and is not under tests/e2e, so a directory ignore would leave
        # a dozen socket tests running here. A local `pytest -q` deliberately
        # still runs them.
        run: |
          set -euo pipefail
          pytest -q -m "not allow_network"
      - name: Report the interpreter actually used
        # Guards against the matrix silently not doing what it says, which is
        # the same failure as claiming a version nobody ran.
        run: python -c "import sys; print('tested on', sys.version)"

  # The gate. This job is named exactly "tests" because that is the name the
  # "protect main" ruleset requires, and it is not a job name that is allowed to
  # drift: the ruleset matches on the string. When this job was first given a
  # matrix its name became "tests (py3.11)" and the rule stopped ever being
  # satisfied, so the PR sat blocked forever with nothing visibly wrong.
  #
  # `tests/unit/test_ci_gate_names.py` asserts this job exists under this name
  # and that it needs the matrix, so the required name cannot quietly disappear
  # again.
  tests:
    name: tests
    needs: [test-version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any interpreter leg failed
        if: >-
          needs.test-version.result != 'success'
        run: |
          echo "at least one interpreter leg did not pass: ${{ needs.test-version.result }}"
          exit 1
      - name: All interpreter legs passed
        run: echo "every claimed Python version passed"

  # The web UI's rendering, in a language nothing else here runs.
  #
  # Until this job existed, no JavaScript ran in CI at all. That is not a
  # theoretical gap: `app.js` ended with `window.__testingHQBlast = {
  # classifyRecord }`, referring to a function the refactor that made the
  # browser read the engine's outcome had already deleted. Naming an undefined
  # identifier is a ReferenceError in strict mode, so the page threw on every
  # load and the web UI did not work. The Python lane-hygiene test passed the
  # whole time, because it checked that `function classifyRecord(` was absent,
  # which it was. It said nothing about the line that still referenced it.
  #
  # No npm install and no lockfile: `node --test` and `node:assert` are in the
  # standard library, and the module under test is loaded with `require` rather
  # than bundled. Adding a dependency tree to test one file of vanilla
  # JavaScript would be a bad trade.
  #
  # Deliberately not a required context. A rendering change should not be able
  # to block a merge of an unrelated Python fix, and the required gates stay
  # `tests` and `end-to-end`. A broken render is caught here on every push
  # instead.
  web-tests:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the browser rendering tests
        run: |
          set -euo pipefail
          node --test web/tests/*.test.cjs
