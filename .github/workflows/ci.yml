name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Declared so a change to the
# repository's default token permissions cannot widen what these jobs can do.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main
# are never cancelled, so every merge keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The interpreter matrix. Named "test-version" so that the gate below can
  # keep the name "tests".
  test-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every version pyproject.toml claims, not a sample of them. The claim
      # was once >=3.9 while only 3.11 was ever run, which is a promise nothing
      # was checking, and on 3.9 and 3.10 it was false in a way that mattered:
      # the TOML parser is stdlib only from 3.11, so `tomli` is a declared
      # conditional dependency. The floor is 3.10 because 3.9 reached end of
      # life in October 2025; see docs/decisions/0002-python-floor-3-10.md.
      #
      # fail-fast is off so one broken version does not hide the state of the
      # others. A matrix that cancels itself on the first failure cannot tell
      # you "3.10 is broken and 3.11 is fine", which is the information you need.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        # -m "not allow_network" is what keeps this job hermetic. `testpaths`
        # is "tests", so a bare `pytest -q` collects every test marked
        # allow_network, and those open real sockets; e2e.yml runs them. A
        # local `pytest -q` deliberately still runs everything.
        run: |
          set -euo pipefail
          pytest -q -m "not allow_network"
      - name: Report the interpreter actually used
        # Guards against the matrix silently not doing what it says, which is
        # the same failure as claiming a version nobody ran.
        run: python -c "import sys; print('tested on', sys.version)"

  # The gate. This job is named exactly "tests" because that is the name the
  # "protect main" ruleset requires, and it is not a job name that is allowed to
  # drift: the ruleset matches on the string. When this job was first given a
  # matrix its name became "tests (py3.11)" and the rule stopped ever being
  # satisfied, so the PR sat blocked forever with nothing visibly wrong.
  tests:
    name: tests
    needs: [test-version]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail if any interpreter leg failed
        if: >-
          needs.test-version.result != 'success'
        run: |
          echo "at least one interpreter leg did not pass: ${{ needs.test-version.result }}"
          exit 1
      - name: All interpreter legs passed
        run: echo "every claimed Python version passed"

  # Pyflakes-class errors only (undefined names, unused imports, shadowed
  # tests). ruff.toml selects F; the version is pinned so a ruff release cannot
  # turn a green tree red overnight.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ruff check --select F
        run: |
          set -euo pipefail
          pip install "ruff==0.17.0"
          ruff check --select F .

  # `report --html` as a user gets it: built into a wheel, installed into a
  # fresh venv outside the checkout, run on a real artifact, and the Node tests
  # pointed at the render.js that the wheel installed. No npm, no lockfile:
  # `node --test` and `node:assert` are in Node's standard library.
  #
  # Not a required context. The required gates stay `tests` and `end-to-end`.
  report-html-tests:
    name: report-html tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build the wheel and install it into a fresh venv
        run: |
          set -euo pipefail
          pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/testinghq-*.whl
      - name: Render an artifact from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tests/fixtures/sample_run_with_failures.json" run.json
          "$RUNNER_TEMP/venv/bin/testinghq" report run.json --html out.html
          grep -q "FLAGGED" out.html
          if grep -Eq "https?://" out.html; then
            echo "out.html names an external URL"
            exit 1
          fi
      - name: Run the render.js tests against the installed file
        run: |
          set -euo pipefail
          export TESTINGHQ_RENDER_JS="$("$RUNNER_TEMP/venv/bin/python" -c 'from testinghq import report_html; print(report_html.script_path())')"
          case "$TESTINGHQ_RENDER_JS" in
            "$GITHUB_WORKSPACE"*) echo "render.js resolved inside the checkout"; exit 1 ;;
          esac
          node --test tests/report_html/*.test.cjs
