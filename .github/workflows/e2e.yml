name: End to end

# The one job that opens a network socket.
#
# It is a separate workflow rather than a job inside CI for a specific reason:
# the hermetic job in ci.yml has the suite-wide network block on, and a test
# that needs a real socket has to opt out of it. Keeping the opt-out in its own
# file means the exemption covers one directory and one purpose, and reviewing
# "what is allowed to touch the network" is a question about this file alone.
#
# What it runs: the real installed binary, over a real loopback socket, against
# a real HTTP server, and then checks the bytes that arrived against what the run
# artifact says was sent. Most tests in this repository inject a fake HTTP
# client, which is correct for most things and blind to everything that only
# appears when a socket is real. Three files make that exception: the binary
# driven as a subprocess (tests/e2e/), the real pipeline
# (tests/integration/), and the real HTTP server (tests/web/).
#
# The tests assert from inside themselves that every connection they made went to
# loopback, so the exemption is self-policing rather than a blank cheque.

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Declared so a change to the
# repository's default token permissions cannot widen what these jobs can do.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main
# are never cancelled, so every merge keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The matrix. Named "e2e-version" so the gate below can keep the name
  # "end-to-end". Same reason as the "test-version" / "tests" split in ci.yml:
  # a job named after its matrix reports a context that changes with the
  # matrix, and branch protection matches a fixed string.
  e2e-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Floor and ceiling only. These tests exercise the wire format and the
      # process boundary, neither of which varies by interpreter, and the full
      # matrix lives in ci.yml.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    name: end-to-end (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The tests spawn the installed `testinghq` console script, so this must
        # be an install and not just an importable source tree.
        run: pip install -e ".[dev]"
      - name: Run every network-exempt test against a real loopback socket
        # Selected by MARKER, not by directory. tests/web/test_server.py is also
        # marked allow_network and starts a real stdlib server, so running only
        # tests/e2e left 23 of the 31 exempt tests running nowhere in CI while
        # the hermetic job correctly refused to run them. Between the two jobs
        # the suite is now covered exactly once, which
        # tests/unit/test_hermetic_suite.py asserts by counting.
        run: |
          set -euo pipefail
          pytest -q -m allow_network
      - name: Run the pipeline demo against a real local sink
        # The demo drives the whole CLI over real loopback sockets against a real
        # intake pipeline it starts itself, and exits non-zero if any of its
        # twelve runs disagrees with its readback. It is here rather than in
        # the hermetic suite because every one of those twelve sends for real,
        # and because the injectable-client seam the rest of the suite relies
        # on means nothing else in CI proves the real transport, the real
        # serializer and the real readback client can talk to a real server.
        # `tests/e2e/` does that for the blast and barrage paths.
        #
        # Binds to 127.0.0.1 only. The demo's own assertions are the second layer:
        # it fails rather than prints if a run's exit code is not the expected one.
        run: |
          set -euo pipefail
          python examples/pipeline_demo.py
      - name: Prove the binary these tests drove is the one CI installed
        run: |
          set -euo pipefail
          command -v testinghq
          testinghq --version

  # The gate. This job is named exactly "end-to-end" and that name is a
  # contract with the "protect main" ruleset, which requires it alongside
  # "tests". Without it the only required check was the hermetic suite, so
  # every test that opens a socket was advisory: the web UI fire-path refusal
  # tests and the pipeline socket tests could go red on a pull request and
  # still merge. A network assertion nobody blocks on is a comment.
  #
  # GitHub matches the context string exactly, which is why the matrix job
  # above is "end-to-end (py3.10)" and this is "end-to-end". A required
  # context that no job ever reports blocks every merge forever with nothing
  # visibly wrong, so the ordering matters in both directions: this job must
  # exist for the rule to be satisfiable, and the rule must be added for this
  # job to mean anything.
  #
  # tests/unit/test_ci_gate_names.py asserts both halves: a job reports this
  # name, and it needs the matrix.
  end-to-end:
    name: end-to-end
    needs: [e2e-version]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail if either e2e leg failed
        if: >-
          needs.e2e-version.result != 'success'
        run: |
          echo "at least one end-to-end leg did not pass: ${{ needs.e2e-version.result }}"
          exit 1
      - name: Both end-to-end legs passed
        run: echo "every end-to-end leg passed"
