name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run guardrail and security tests
        run: |
          set -euo pipefail
          pytest -q tests/security

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and pip-audit
        run: |
          set -euo pipefail
          # Upgrade the build toolchain before auditing. pip-audit audits the whole
          # environment, so the runner's own pip and setuptools are in scope. This
          # repo declares no runtime dependencies, so without this the job reports
          # only on the toolchain and reds every PR for reasons unrelated to the
          # change under review. setuptools is the one that actually bites: the
          # hosted image ships 79.0.1 (PYSEC-2026-3447, fixed in 83.0.0).
          # Upgrading fixes the finding. Do not swap this for --ignore-vuln, which
          # would hide a real CVE to buy a green tick.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          pip-audit
