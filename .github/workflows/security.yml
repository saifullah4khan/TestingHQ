name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run guardrail and security tests
        run: |
          set -euo pipefail
          pytest -q tests/security

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and pip-audit
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          pip-audit
