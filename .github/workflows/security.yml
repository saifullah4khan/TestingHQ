name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# The workflow only reads the repository. Declared so a change to the
# repository's default token permissions cannot widen what these jobs can do.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main
# are never cancelled, so every merge keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Floor and ceiling rather than every version. The guardrail tests do not
      # vary by interpreter, so what matters here is that the extremes work,
      # not that 3.11 does. The full matrix lives in ci.yml.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    name: security-tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run guardrail and security tests
        run: |
          set -euo pipefail
          pytest -q tests/security

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Two interpreters on purpose. The project has a conditional runtime
      # dependency, `tomli` below Python 3.11, and pip-audit only sees what is
      # installed. Auditing on a single 3.11 job would never see it, so a
      # vulnerable pin of tomli would ship unremarked. 3.10 audits the
      # dependency, 3.11 audits the stdlib-only path.
      #
      # 3.10 is also the floor, so this matrix covers every version the audit
      # could ever need. It used to include 3.9 and that leg could not go
      # green: pip-audit audits the whole environment, the environment contains
      # the runner's setuptools, and the fix for PYSEC-2026-3447 is setuptools
      # 83.0.0, which declares `requires-python >=3.10`. On 3.9 pip can install
      # at most 79.0.1, the vulnerable version, so the only way past it was
      # --ignore-vuln. See docs/decisions/0002-python-floor-3-10.md.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    name: dependency-audit (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pip-audit
        run: |
          set -euo pipefail
          # Upgrade the build toolchain before auditing. pip-audit audits the whole
          # environment, so the runner's own pip and setuptools are in scope. On a
          # 3.11 job the project itself contributes no third-party runtime package,
          # so without this the job reports only on the toolchain and reds every PR
          # for reasons unrelated to the change under review. setuptools is the one
          # that actually bites: the hosted image ships 79.0.1 (PYSEC-2026-3447,
          # fixed in 83.0.0, which needs Python 3.10 and is why 3.9 is not in the
          # matrix above). Upgrading fixes the finding. Do not swap this for
          # --ignore-vuln, which would hide a real CVE to buy a green tick.
          #
          # The 3.10 job is not redundant. It is the one that has `tomli`
          # installed, so it is the only job that would ever audit it.

          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: |
          set -uo pipefail
          # --skip-editable: the project itself is installed with `pip install -e`,
          # and auditing it means asking PyPI about a package we have not
          # published. That lookup is pointless, and on 2026-09-28 it was the one
          # that failed main, when PyPI answered it with a 503.
          #
          # The retry is ONLY for PyPI being down (pip-audit's ServiceError). A
          # vulnerability finding also exits 1, so the output is checked: a
          # finding fails at once and is never retried into a green tick.
          for attempt in 1 2 3; do
            if pip-audit --skip-editable 2>&1 | tee audit.log; then
              exit 0
            fi
            if ! grep -q "ServiceError" audit.log; then
              exit 1
            fi
            echo "PyPI unavailable (attempt ${attempt} of 3), retrying in 30s"
            sleep 30
          done
          echo "PyPI was unavailable for every attempt; the audit did not run."
          exit 1
