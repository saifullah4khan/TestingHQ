[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testinghq"
version = "0.0.1"
description = "Self-testing tools for intake pipelines. Blast fires realistic-to-garbled inbound-email payloads at an endpoint you control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saifullah Khan", email = "saifullah4khan@gmail.com" }]
# Only the TOML parser. The stdlib grew `tomllib` in 3.11, so below that
# `tomli` is the same package under its old name and `core/config.py` imports
# it as a fallback. Without this declaration, installing on 3.10 gave a tool
# whose target config could not be read.
dependencies = [
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
testinghq = "testinghq.cli:main"

[tool.setuptools.packages.find]
include = ["testinghq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path for the whole suite. Without this, `pytest -q`
# (what ci.yml runs) and `python -m pytest -q` disagree: the -m form inserts the
# working directory and the bare form does not, so anything importing a
# non-installed top-level package from the root, such as `web`, passes locally
# and dies in CI. Only `testinghq*` is an installed package; `web` is served
# from the tree. Do not remove without making `pytest -q` green from a clean
# clone first.
pythonpath = ["."]
markers = [
  "allow_network: opt out of the suite-wide network block in tests/conftest.py. Only for tests that genuinely need loopback, such as the ones that start a real HTTP server. Registering it matters: an unregistered marker is silently ignored, so a typo would leave the test blocked rather than the misspelling being an error.",
]
