[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testinghq"
version = "0.0.1"
description = "Self-testing tools for intake pipelines. Blast fires realistic-to-garbled inbound-email payloads at an endpoint you control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saifullah Khan", email = "saifullah4khan@gmail.com" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
testinghq = "testinghq.cli:main"

[tool.setuptools.packages.find]
include = ["testinghq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
