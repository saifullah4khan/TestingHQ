[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testinghq"
version = "0.1.0"
description = "Fuzz, load-test and verify your inbound email webhook. Catches lost, duplicated, mis-threaded and looped mail that a 200 OK hides."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saifullah Khan", email = "saifullah4khan@gmail.com" }]
# Only the TOML parser. The stdlib grew `tomllib` in 3.11, so below that
# `tomli` is the same package under its old name and `core/config.py` imports
# it as a fallback. Without this declaration, installing on 3.10 gave a tool
# whose target config could not be read.
dependencies = [
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
# setuptools is here for the wheel test in tests/unit/test_release.py, which
# builds without isolation so the suite never downloads anything.
dev = ["pytest>=7", "ruff>=0.6", "setuptools>=77"]

[project.scripts]
testinghq = "testinghq.cli:main"

[tool.setuptools.packages.find]
include = ["testinghq*"]

# Non-Python files the package reads at run time. tests/unit/test_package_data.py
# checks every non-Python file under testinghq/ is covered by a pattern here.
[tool.setuptools.package-data]
"testinghq.pipeline" = ["fixtures/*.json"]
"testinghq.report_html" = ["template.html", "render.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `pytest -q` and `python -m pytest -q` import
# the same tree, installed or not.
pythonpath = ["."]
markers = [
  "allow_network: opt out of the suite-wide network block in tests/conftest.py. Only for tests that genuinely need loopback, such as the ones that start a real HTTP server. Registering it matters: an unregistered marker is silently ignored, so a typo would leave the test blocked rather than the misspelling being an error.",
]
