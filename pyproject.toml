[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testinghq"
version = "0.0.1"
description = "Self-testing tools for intake pipelines. Blast fires realistic-to-garbled inbound-email payloads at an endpoint you control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saifullah Khan", email = "saifullah4khan@gmail.com" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
testinghq = "testinghq.cli:main"

[tool.setuptools.packages.find]
include = ["testinghq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path for the whole suite. Without this, `pytest -q`
# (what ci.yml runs) and `python -m pytest -q` disagree: the -m form inserts the
# working directory and the bare form does not, so anything importing a
# non-installed top-level package from the root, such as `web`, passes locally
# and dies in CI. Only `testinghq*` is an installed package; `web` is served
# from the tree. Do not remove without making `pytest -q` green from a clean
# clone first.
pythonpath = ["."]
