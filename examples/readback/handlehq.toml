# Readback recipe: a HandleHQ deployment
#
# STATUS: NOT RUN. This recipe has never been pointed at a live deployment.
#
# There is no result, no timing, and no verified field map behind this file. See
# docs/DOGFOOD.md, which says the same and explains how to run it.
#
# WHY THE URL BELOW IS NOT A PLACEHOLDER YOU CAN IGNORE
#
# It is set to a name that cannot resolve, rather than to localhost. A localhost
# URL in a template is the trap: it is reachable, it answers 404, and 404 is
# "no record of this message", which is a FINDING. A run against it would report
# a pipeline losing every message, and the losing part would be a file nobody
# edited. A name that cannot resolve fails at DNS instead, which is legible.
#
# HOW TO ACTUALLY RUN IT
#
#   cp examples/readback/handlehq.toml examples/readback/handlehq.local.toml
#   $EDITOR examples/readback/handlehq.local.toml      # set the url
#   set -a && . ./.env && set +a                        # HANDLEHQ_TOKEN
#   testinghq config validate examples/readback/handlehq.local.toml
#
# The .local.toml copy is gitignored, so the URL and whatever else you change
# never reach a commit. Do not edit this file to run against a deployment: it is
# tracked, and a real host left in it is a real host in git history.
#
# WHY THE FIELD MAP LOOKS INCOMPLETE, AND WHAT IT ACTUALLY DOES
#
# A field path that does not resolve reports NOT CHECKED, with the reason
# "adapter cannot see field". That reads exactly like a deployment that stores
# less than expected, so a guessed path is worse than no path: it turns a thing
# worth noticing into a thing that looks already checked.
#
# So this table names only ticket_id, which is required and whose absence is a
# refusal rather than a silent skip. Everything else is commented out.
#
# IMPORTANT, because the table above reads as though nothing else is checked and
# it is not. The field map is MERGED over the defaults, not used alone. So every
# default path is still live: a response carrying `subject` will have its
# subject checked, even though this file never mentions subject. The defaults
# assume the API names its fields as TestingHQ names them, which is exactly the
# assumption that has not been checked against a real deployment.
#
# In other words: a field commented out here is still being looked for, at its
# default path. Uncommenting one is how you CHANGE where it is looked for, not
# how you start looking. To look somewhere the defaults do not, the path has to
# be stated.
#
# That is enough for `ledger`, which is the check that matters most: did every
# message produce exactly one record. Checking that the deployment PARSED each
# message correctly needs the real response shape first.

[targets.handlehq]
name = "handlehq"
url = "http://127.0.0.1:8000/intake"

[readback]
kind = "http"
# Replace this. See the note at the top of this file about why it is not
# localhost.
url = "https://replace-me.invalid/api/intake-records"
tag_param = "tag"
items_key = "items"
timeout = 30.0

# A real deployment is a public host, and the readback guardrail refuses one
# unless it is told not to. Left commented out on purpose: setting
# allow_public_hosts = true here grants the permission permanently, in a
# tracked file, for a URL that is a store which may hold other people's data.
# Prefer passing --allow-public-readback on the command line, so a person
# re-decides it every run.
# allow_public_hosts = true

# The token. env: only. A literal is refused at load, so this file is safe to
# commit and safe to paste into a bug report. A variable that is not set is
# refused too, before the run sends anything.
[readback.headers]
Authorization = "env:HANDLEHQ_TOKEN"

[readback.fields]
ticket_id = "id"

# Uncomment to CHANGE where a field is looked for, not to start looking for it.
# See the note above: the defaults are always live underneath. See the note
# above for why each of these is a guess until a real response says otherwise.
#
# from_addr = "from"
# subject = "subject"
# body = "body"
# message_id = "message_id"
# route = "queue"
# tag = "tag"
# category = "category"
# priority = "priority"
#
# attachment_names is deliberately never mapped from a count. See the Zendesk
# recipe for why a count is not a name.
