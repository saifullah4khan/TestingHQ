# Readback recipe: Zendesk Support API
#
# STATUS: NOT RUN against a live Zendesk account. Written from Zendesk's
# published API documentation (Search API, Tickets API, Ticket Via Object).
# Read the field paths as "what the documentation says the response looks
# like", not as "this was seen to work". If one is wrong the failure is
# visible and safe: that check reports NOT CHECKED and says which field the
# adapter could not see.
#
# Copy to target.toml, fill in your subdomain, and pass --config.
#
#   export ZENDESK_AUTH="Basic $(printf '%s/token:%s' "$ZENDESK_EMAIL" "$ZENDESK_API_TOKEN" | base64 | tr -d '\n')"
#   testinghq verify fire --target zendesk --send --config target.toml --max-wait 300
#
# AUTH. Zendesk API tokens use Basic auth with the username
# "<agent email>/token" and the token as the password, base64 encoded behind a
# "Basic " prefix. The shell line above builds exactly that, so the value is
# assembled outside this file. A [readback.headers] value that is not an
# `env:` reference is refused, because a config file is a file that gets shared.
#
# WAITING. Zendesk search is backed by an index that lags ticket creation by
# seconds to a few minutes. With the default --max-wait of 60 a slow index
# reads as UNSETTLED rather than as loss, but start with --max-wait 300 here.

[targets.zendesk]
name = "zendesk"
url = "http://127.0.0.1:8000/intake"

# ---------------------------------------------------------------------------
# Readback
# ---------------------------------------------------------------------------
#
# The lookup is GET /api/v2/search.json?query=type:ticket tags:<tag>.
# `type:ticket` keeps users and organizations out of the results, and
# `tags:<tag>` matches a ticket carrying the TestingHQ tag as a Zendesk tag.
# That needs the pipeline to copy the X-TestingHQ-Tag header (or the
# [testinghq:<tag>] body marker) into the ticket's tags: one trigger, or one
# line in the code that creates the ticket. If it does not, search the text
# instead, since the tag is in the body:
#
#   query = 'type:ticket "{tag}"'
#
# Search results come 100 to a page, with the next page's url in `next_page`.
#
# `allow_public_hosts` is REQUIRED here and you should think twice before
# keeping it. A real Zendesk is a public host, and the readback guardrail
# exists because a readback URL is usually a ticket store holding other
# people's data. Remove the line and pass --allow-public-readback per run if
# you would rather the decision be made every time.

[readback]
kind = "http"
url = "https://your-subdomain.zendesk.com/api/v2/search.json"
tag_param = "query"
query = "type:ticket tags:{tag}"
items_key = "results"
next_path = "next_page"
timeout = 20.0
allow_public_hosts = true

# Search needs a query, so it cannot list every ticket: stray detection is off
# and the ledger reports strays as not searched rather than as none.
enumerate = false

[readback.headers]
Authorization = "env:ZENDESK_AUTH"

# ---------------------------------------------------------------------------
# Field map
# ---------------------------------------------------------------------------
#
# A search result of type ticket is a ticket object. `via.source.from.address`
# is the sender of a ticket created from email. The plain-text body is
# `description`; the HTML part of a multipart message is stored as a comment,
# not in `description`, so only the plain-text part is checked.
#
# `priority = false` unmaps a default: a stock Zendesk `priority` is the
# ticket's urgency, not a classifier's label, and reading it as one would make
# a steady run measure the wrong thing.

[readback.fields]
ticket_id = "id"
from_addr = "via.source.from.address"
subject = "subject"
body = "description"
route = "group_id"
priority = false

# NOT MAPPED, each for a reason:
#
#   attachment_names  A ticket in a search result carries no attachment list.
#                     Attachments live on comments
#                     (/api/v2/tickets/{id}/comments), a second request this
#                     adapter does not make. Write a custom adapter if you need
#                     them.
#   message_id,       Zendesk threads by its own conversation model, not by
#   in_reply_to,      RFC 5322 headers, and a ticket does not expose them.
#   references
#   tag               `tags` is a list of every tag on the ticket. The search
#                     already found the ticket by the tag, so nothing needs to
#                     carry it back.
#   category          Only if you have a custom triage field, which needs a
#                     custom adapter to read out of `custom_fields`.
