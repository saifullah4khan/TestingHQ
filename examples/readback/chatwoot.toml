# Readback recipe: Chatwoot
#
# STATUS: NOT RUN against a live Chatwoot. Written from Chatwoot's published
# Application API documentation (Conversations: filter). Treat the field paths
# as "what the documentation says", not as "this was seen to work".
#
# Chatwoot takes inbound email through an email inbox and opens a conversation
# per thread. This recipe looks a conversation up by label.
#
#   export CHATWOOT_API_TOKEN="..."   # Profile settings > Access token
#   testinghq config basic-auth actionmailbox --env CHATWOOT_INGRESS_AUTH
#   testinghq verify fire --target chatwoot --send --config target.toml
#
# Never put the token or the ingress password in this file: a header value
# that is not an `env:` reference is refused.

# Chatwoot ingests SendGrid's raw mode (the whole message in the `email`
# field) at the Action Mailbox ingress below, with RAILS_INBOUND_EMAIL_SERVICE
# set to sendgrid. The ingress wants HTTP Basic auth, user `actionmailbox` and
# the RAILS_INBOUND_EMAIL_PASSWORD Chatwoot runs with: `testinghq config
# basic-auth actionmailbox --env CHATWOOT_INGRESS_AUTH` reads that password
# and prints the CHATWOOT_INGRESS_AUTH line for .env.
#
# The ingress turns each envelope recipient into an X-Original-To header, and
# Chatwoot files a message under the email inbox whose address or forwarding
# address is in To, Cc or X-Original-To, dropping anything else. Set
# envelope_to to your inbox's address (Settings > Inboxes > the inbox >
# Configuration), a synthetic one as every address TestingHQ sends must be.
[targets.chatwoot]
name = "chatwoot"
url = "http://127.0.0.1:3000/rails/action_mailbox/sendgrid/inbound_emails"
format = "sendgrid-raw"
envelope_to = "support@chatwoot.test"

[targets.chatwoot.headers]
Authorization = "env:CHATWOOT_INGRESS_AUTH"

# ---------------------------------------------------------------------------
# Readback: message search, by the tag marker
# ---------------------------------------------------------------------------
#
#   GET /api/v1/accounts/1/search/messages?q=[testinghq:<tag>]
#
# Chatwoot's message search matches a message whose content contains `q`
# (an ILIKE, newest first, messages from the last three months). The content
# of an email message is its text body, so the [testinghq:<tag>] marker every
# TestingHQ message carries is in it, and the closing bracket keeps one tag
# from matching a longer one. The answer is one record per message, so a
# reply Chatwoot threads into an earlier conversation reads back as itself,
# with the conversation it landed on as its ticket. The conversation list
# answers per conversation instead, and every message of a thread read back
# as the thread's first sender and latest message.
#
# The response is {"payload": {"messages": [...]}}, 15 to a page, paged with
# `page`. The listing, for stray records, is a search for `testinghq:`: every
# message any TestingHQ run sent, and not the activity messages Chatwoot adds
# itself. A record the pipeline made with no marker at all is not listed.
#
# Account 1 is the first account on an instance; use yours.
#
# A Chatwoot on localhost or a private address needs nothing more. A hosted one
# is a public host: add allow_public_hosts = true, or pass
# --allow-public-readback per run.

[readback]
kind = "http"
url = "http://127.0.0.1:3000/api/v1/accounts/1/search/messages"
method = "GET"
tag_param = "q"
query = "[testinghq:{tag}]"
items_key = "payload.messages"
page_param = "page"
list_path = "/api/v1/accounts/1/search/messages?q=testinghq:"
enumerate = true
max_pages = 100
timeout = 15.0

[readback.headers]
api_access_token = "env:CHATWOOT_API_TOKEN"

# ---------------------------------------------------------------------------
# Field map
# ---------------------------------------------------------------------------
#
# A message as the search renders it. `sender` is the contact Chatwoot
# recorded the message as coming from, and `content_attributes.email` keeps
# the parsed email: its subject and its threading headers without their angle
# brackets. `conversation_id` is the ticket, and `inbox_id` the route.

[readback.fields]
ticket_id = "conversation_id"
from_addr = "sender.email"
subject = "content_attributes.email.subject"
body = "content"
route = "inbox_id"
message_id = "content_attributes.email.message_id"
in_reply_to = "content_attributes.email.in_reply_to"
references = "content_attributes.email.references"

# NOT MAPPED, each for a reason:
#
#   attachment_names  A message's attachments carry urls, not the original
#                     file names, so a name check would compare different
#                     things.
#   tag               Not a field of its own: the search found the message by
#                     the marker in its content.
