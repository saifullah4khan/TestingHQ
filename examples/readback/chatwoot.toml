# Readback recipe: Chatwoot
#
# STATUS: NOT RUN against a live Chatwoot. Written from Chatwoot's published
# Application API documentation (Conversations: filter). Treat the field paths
# as "what the documentation says", not as "this was seen to work".
#
# Chatwoot takes inbound email through an email inbox and opens a conversation
# per thread. This recipe looks a conversation up by label.
#
#   export CHATWOOT_API_TOKEN="..."   # Profile settings > Access token
#   testinghq config basic-auth actionmailbox --env CHATWOOT_INGRESS_AUTH
#   testinghq verify fire --target chatwoot --send --config target.toml
#
# Never put the token or the ingress password in this file: a header value
# that is not an `env:` reference is refused.

# Chatwoot ingests SendGrid's raw mode (the whole message in the `email`
# field) at the Action Mailbox ingress below, with RAILS_INBOUND_EMAIL_SERVICE
# set to sendgrid. The ingress wants HTTP Basic auth, user `actionmailbox` and
# the RAILS_INBOUND_EMAIL_PASSWORD Chatwoot runs with: `testinghq config
# basic-auth actionmailbox --env CHATWOOT_INGRESS_AUTH` reads that password
# and prints the CHATWOOT_INGRESS_AUTH line for .env.
#
# The ingress turns each envelope recipient into an X-Original-To header, and
# Chatwoot files a message under the email inbox whose address or forwarding
# address is in To, Cc or X-Original-To, dropping anything else. Set
# envelope_to to your inbox's address (Settings > Inboxes > the inbox >
# Configuration), a synthetic one as every address TestingHQ sends must be.
[targets.chatwoot]
name = "chatwoot"
url = "http://127.0.0.1:3000/rails/action_mailbox/sendgrid/inbound_emails"
format = "sendgrid-raw"
envelope_to = "support@chatwoot.test"

[targets.chatwoot.headers]
Authorization = "env:CHATWOOT_INGRESS_AUTH"

# ---------------------------------------------------------------------------
# Readback
# ---------------------------------------------------------------------------
#
# The lookup is a POST to the conversation filter endpoint, asking for
# conversations labelled with the tag:
#
#   POST /api/v1/accounts/<account_id>/conversations/filter
#   {"payload": [{"attribute_key": "labels", "filter_operator": "equal_to",
#                 "values": ["<tag>"], "query_operator": null}]}
#
# That needs the tag on the conversation as a label, put there by whatever sits
# in front of Chatwoot: a Chatwoot automation rule adds a fixed label, not one
# taken from the message. Chatwoot labels allow lowercase letters, digits,
# hyphens and underscores, which every TestingHQ tag is made of. With nothing
# in front, look the conversation up by the [testinghq:<tag>] body marker
# instead, through the conversation list's `q` search, as
# sweep/configs/chatwoot.toml does.
#
# Results come under `payload`, 25 to a page, paged with `page`. A POST search
# cannot list every conversation, so stray detection is off.
#
# A Chatwoot on localhost or a private address needs nothing more. A hosted one
# is a public host: add allow_public_hosts = true, or pass
# --allow-public-readback per run.

[readback]
kind = "http"
url = "http://127.0.0.1:3000/api/v1/accounts/1/conversations/filter"
method = "POST"
body = '{"payload": [{"attribute_key": "labels", "filter_operator": "equal_to", "values": ["{tag}"], "query_operator": null}]}'
items_key = "payload"
page_param = "page"
enumerate = false
timeout = 15.0

[readback.headers]
api_access_token = "env:CHATWOOT_API_TOKEN"

# ---------------------------------------------------------------------------
# Field map
# ---------------------------------------------------------------------------
#
# A conversation in a filter result. The sender is the contact in
# `meta.sender`; the subject of an email conversation is kept in
# `additional_attributes.mail_subject`; `messages` carries the latest message,
# which for a conversation TestingHQ just opened is the incoming email.

[readback.fields]
ticket_id = "id"
from_addr = "meta.sender.email"
subject = "additional_attributes.mail_subject"
body = "messages.0.content"
route = "inbox_id"

# NOT MAPPED, each for a reason:
#
#   attachment_names  A message's attachments carry urls, not the original
#                     file names, so a name check would compare different
#                     things.
#   message_id,       Chatwoot keeps the email headers on the message's content
#   in_reply_to,      attributes, which differ by version; map them once you
#   references        have seen your own instance's response.
#   tag               `labels` is a list, and the filter already found the
#                     conversation by the tag.
