# Readback recipe: Freshdesk API
#
# STATUS: NOT RUN against a live Freshdesk account. Written from Freshdesk's
# published API documentation (Search Tickets, Tickets). Treat the field paths
# as "what the documentation says", not as "this was seen to work".
#
# Copy to target.toml, fill in your domain, and pass --config.
#
#   export FRESHDESK_AUTH="Basic $(printf '%s:X' "$FRESHDESK_API_KEY" | base64 | tr -d '\n')"
#   testinghq verify fire --target freshdesk --send --config target.toml --max-wait 300
#
# AUTH. Freshdesk uses Basic auth with the API key as the username and any
# password ("X" by convention), base64 encoded behind a "Basic " prefix. The
# shell line above builds exactly that. Never put the key in this file: a
# [readback.headers] value that is not an `env:` reference is refused.
#
# WAITING. Freshdesk search is index-backed and lags ticket creation, so start
# with --max-wait 300. A slow index reads as UNSETTLED, not as loss.
#
# RATE. Freshdesk plans allow 50 to 700 API calls a minute. The default
# --readback-rate of 4 a second is 240 a minute; lower it on a small plan.

[targets.freshdesk]
name = "freshdesk"
url = "http://127.0.0.1:8000/intake"

# ---------------------------------------------------------------------------
# Readback
# ---------------------------------------------------------------------------
#
# The lookup is the filter endpoint:
#
#   GET /api/v2/search/tickets?query="tag:'<tag>'"
#
# Freshdesk's search query is a quoted expression over structured fields only,
# not full text, so the ticket has to carry the TestingHQ tag as a Freshdesk
# tag: the pipeline copies the X-TestingHQ-Tag header (or the [testinghq:<tag>]
# body marker) into the ticket's tags when it creates the ticket. A pipeline
# that does not will find nothing, and the report will say no record was found.
#
# Results come under `results`, 30 to a page, at most 10 pages, paged with
# `page`.
#
# `allow_public_hosts` is REQUIRED for a real Freshdesk, which is a public
# host. Remove the line and pass --allow-public-readback per run if you would
# rather the decision be made every time.

[readback]
kind = "http"
url = "https://your-domain.freshdesk.com/api/v2/search/tickets"
tag_param = "query"
query = "\"tag:'{tag}'\""
items_key = "results"
page_param = "page"
max_pages = 10
timeout = 20.0
allow_public_hosts = true

# Freshdesk search cannot list every ticket, so stray detection is off here and
# the ledger reports strays as not searched rather than as none.
enumerate = false

[readback.headers]
Authorization = "env:FRESHDESK_AUTH"

# ---------------------------------------------------------------------------
# Field map
# ---------------------------------------------------------------------------
#
# A Freshdesk ticket is flat. `description_text` is the plain-text body; if
# your plan's search results omit it, the body check reports NOT CHECKED.

[readback.fields]
ticket_id = "id"
subject = "subject"
body = "description_text"
route = "group_id"
priority = "priority"
category = "type"

# NOT MAPPED, each for a reason:
#
#   from_addr         Freshdesk records the requester as `requester_id`, an
#                     integer, not an address. The address needs a second GET
#                     to /api/v2/contacts/{id}, which this adapter does not
#                     make. Mapping `requester_id` would compare "42" against
#                     an address and fail on every ticket. Write a custom
#                     adapter (`--readback mypkg.adapters:freshdesk`) for a
#                     sender check.
#   attachment_names  Not in a search result.
#   message_id,       Freshdesk does not expose RFC 5322 threading headers on a
#   in_reply_to,      ticket.
#   references
#   tag               `tags` is a list of every tag on the ticket, and the
#                     search already found the ticket by the tag.
